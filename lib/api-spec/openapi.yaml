openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: Audition foundation and development-only integration diagnostics. Audition domain endpoints remain 501 stubs.
servers:
  - url: /api
tags:
  - { name: health, description: Existing health endpoint }
  - { name: auditions, description: Frozen audition definitions and invitations }
  - { name: sessions, description: Server-timed candidate evidence }
  - { name: evaluations, description: Requirement-level assessment }
  - { name: credentials, description: Signed session credentials }
paths:
  /company:
    post:
      operationId: createCompanyAudition
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyInput" }
      responses:
        "201":
          description: Company capability link
          content:
            application/json:
              schema: { type: object, required: [company_token], properties: { company_token: { type: string } } }
  /company/{token}:
    get:
      operationId: getCompany
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Company workspace and Callbacks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyWorkspace" }
  /company/{token}/draft:
    post:
      operationId: draftCompanyQuestions
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyDraftInput" }
      responses:
        "200":
          description: Generated or saved editable draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuestionDraft" }
  /company/{token}/approve:
    post:
      operationId: approveCompanyQuestions
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyDraftInput" }
      responses:
        "200":
          description: Frozen snapshot
          content:
            application/json:
              schema: { type: object, required: [approved, snapshot_hash], properties: { approved: { type: boolean }, snapshot_hash: { type: string } } }
  /company/{token}/candidates:
    post:
      operationId: inviteCompanyCandidate
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CandidateInvitation" }
      responses:
        "201":
          description: New single-use candidate invite
          content:
            application/json:
              schema: { type: object, required: [id, invite_path], properties: { id: { type: string }, invite_path: { type: string } } }
  /company/{token}/candidates/{candidateId}/callback:
    post:
      operationId: sendCompanyCallback
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: candidateId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Human action marks candidate and returns an email draft, never sends email
          content:
            application/json:
              schema: { type: object, required: [marked, mailto], properties: { marked: { type: boolean }, mailto: { type: string } } }
  /review/{candidateId}:
    get:
      operationId: getHiringReport
      parameters:
        - { name: candidateId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Human-review recommendation and evidence, company capability required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HiringReport" }
  /review/{candidateId}/retry:
    post:
      operationId: retryHiringReport
      parameters:
        - { name: candidateId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Queued
          content:
            application/json:
              schema: { type: object, properties: { queued: { type: boolean } }, required: [queued] }
  /review/{candidateId}/screenshots/{screenshotId}:
    get:
      operationId: getReviewScreenshot
      parameters:
        - { name: candidateId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: screenshotId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Private JPEG, authorized company only
          content:
            image/jpeg:
              schema: { type: string, format: binary }
  /candidate/room:
    get:
      operationId: getCandidateRoom
      description: Candidate-scoped opaque invite token in Authorization Bearer header; never a provider API key.
      responses:
        "200":
          description: Frozen audition, candidate and any existing irreversible session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CandidateRoom" }
  /candidate/start:
    post:
      operationId: startCandidateRoom
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoomStartInput" }
      responses:
        "200": { $ref: "#/components/responses/RoomSessionResult" }
  /candidate/session/{sessionId}:
    parameters: [{ $ref: "#/components/parameters/SessionId" }]
    get:
      operationId: getCandidateSession
      responses:
        "200": { $ref: "#/components/responses/RoomSessionResult" }
  /candidate/session/{sessionId}/voice:
    parameters: [{ $ref: "#/components/parameters/SessionId" }]
    post:
      operationId: getCandidateVoice
      responses:
        "200":
          description: Candidate-authorized signed URL and frozen dynamic variables, no provider key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomVoice" }
  /candidate/session/{sessionId}/conversation:
    parameters: [{ $ref: "#/components/parameters/SessionId" }]
    post:
      operationId: bindCandidateConversation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConversationBinding" }
      responses:
        "200": { $ref: "#/components/responses/RoomSessionResult" }
  /candidate/session/{sessionId}/snapshots:
    parameters: [{ $ref: "#/components/parameters/SessionId" }]
    post:
      operationId: saveCandidateSnapshot
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoomSnapshotInput" }
      responses:
        "200": { $ref: "#/components/responses/RoomEvidenceResult" }
  /candidate/session/{sessionId}/screenshots/{timestampMs}:
    parameters:
      - { $ref: "#/components/parameters/SessionId" }
      - { name: timestampMs, in: path, required: true, schema: { type: integer, minimum: 0, maximum: 360000, multipleOf: 10000 } }
    post:
      operationId: saveCandidateScreenshot
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
      responses:
        "200": { $ref: "#/components/responses/RoomEvidenceResult" }
  /candidate/session/{sessionId}/integrity:
    parameters: [{ $ref: "#/components/parameters/SessionId" }]
    post:
      operationId: saveCandidateIntegrity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoomIntegrityInput" }
      responses:
        "200": { $ref: "#/components/responses/RoomEvidenceResult" }
  /candidate/session/{sessionId}/commands:
    parameters: [{ $ref: "#/components/parameters/SessionId" }]
    post:
      operationId: saveCandidateCommand
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoomCommandInput" }
      responses:
        "200":
          description: App-only control text excluded from candidate scoring
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomCommand" }
  /candidate/session/{sessionId}/submit:
    parameters: [{ $ref: "#/components/parameters/SessionId" }]
    post:
      operationId: submitCandidateRoom
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionSubmission" }
      responses:
        "200": { $ref: "#/components/responses/RoomSessionResult" }
  /admin/health:
    get:
      operationId: getAdminHealth
      tags: [health]
      summary: Read configuration and most recent diagnostic results without provider calls
      responses:
        "200":
          description: Current diagnostic state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminHealth" }
        "403": { $ref: "#/components/responses/DiagnosticsDisabled" }
  /admin/health/{checkId}:
    post:
      operationId: runAdminHealthCheck
      tags: [health]
      summary: Run one fixed server-side provider test (results reused for 60 seconds)
      parameters:
        - name: checkId
          in: path
          required: true
          schema: { type: string, enum: [nebius_models, nebius_text, nebius_vision, elevenlabs_tts, elevenlabs_agent] }
      responses:
        "200":
          description: Provider success, error or missing configuration (provider failures are represented in the result)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectionCheck" }
        "400": { $ref: "#/components/responses/DiagnosticsDisabled" }
        "403": { $ref: "#/components/responses/DiagnosticsDisabled" }
  /admin/health/tts-audio:
    get:
      operationId: getAdminHealthAudio
      tags: [health]
      summary: Play temporary diagnostic audio; never generates audio on GET
      responses:
        "200":
          description: In-memory MP3 sample retained for five minutes
          content:
            audio/mpeg:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/DiagnosticsDisabled" }
        "404": { $ref: "#/components/responses/DiagnosticsDisabled" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /auditions:
    get:
      operationId: listAuditions
      tags: [auditions]
      responses:
        "200":
          description: Future audition list; never includes invite tokens
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Audition" } }
        "501": { $ref: "#/components/responses/NotImplemented" }
    post:
      operationId: createAudition
      tags: [auditions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuditionInput" }
      responses:
        "201":
          description: Future frozen audition and creation-only invite token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditionInvitation" }
        "501": { $ref: "#/components/responses/NotImplemented" }
  /auditions/{auditionId}:
    parameters:
      - { $ref: "#/components/parameters/AuditionId" }
    get:
      operationId: getAudition
      tags: [auditions]
      responses: { "200": { $ref: "#/components/responses/AuditionResult" }, "501": { $ref: "#/components/responses/NotImplemented" } }
  /auditions/{auditionId}/candidates:
    parameters:
      - { $ref: "#/components/parameters/AuditionId" }
    get:
      operationId: listCandidates
      tags: [auditions]
      responses:
        "200":
          description: Future candidates belonging to this audition
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Candidate" } }
        "501": { $ref: "#/components/responses/NotImplemented" }
    post:
      operationId: inviteCandidate
      tags: [auditions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CandidateInput" }
      responses: { "201": { $ref: "#/components/responses/CandidateResult" }, "501": { $ref: "#/components/responses/NotImplemented" } }
  /candidates/{candidateId}:
    parameters:
      - { name: candidateId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getCandidate
      tags: [auditions]
      responses: { "200": { $ref: "#/components/responses/CandidateResult" }, "501": { $ref: "#/components/responses/NotImplemented" } }
  /invites/resolve:
    post:
      operationId: resolveInvite
      tags: [auditions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteInput" }
      responses: { "200": { $ref: "#/components/responses/AuditionResult" }, "501": { $ref: "#/components/responses/NotImplemented" } }
  /sessions:
    post:
      operationId: startSession
      tags: [sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionInput" }
      responses: { "201": { $ref: "#/components/responses/SessionResult" }, "200": { $ref: "#/components/responses/SessionResult" }, "501": { $ref: "#/components/responses/NotImplemented" } }
  /sessions/{sessionId}:
    parameters:
      - { $ref: "#/components/parameters/SessionId" }
    get:
      operationId: getSession
      tags: [sessions]
      responses: { "200": { $ref: "#/components/responses/SessionResult" }, "501": { $ref: "#/components/responses/NotImplemented" } }
  /sessions/{sessionId}/transcript:
    parameters:
      - { $ref: "#/components/parameters/SessionId" }
    get:
      operationId: getTranscript
      tags: [sessions]
      responses:
        "200":
          description: Future transcript in sequence order
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/TranscriptEntry" } }
        "501": { $ref: "#/components/responses/NotImplemented" }
    post:
      operationId: appendTranscript
      tags: [sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TranscriptBatch" }
      responses: { "204": { description: Future batch accepted }, "501": { $ref: "#/components/responses/NotImplemented" } }
  /sessions/{sessionId}/editor-snapshots:
    parameters:
      - { $ref: "#/components/parameters/SessionId" }
    get:
      operationId: getEditorSnapshots
      tags: [sessions]
      responses:
        "200":
          description: Future snapshots in timestamp order
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/EditorSnapshot" } }
        "501": { $ref: "#/components/responses/NotImplemented" }
    post:
      operationId: appendEditorSnapshots
      tags: [sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EditorSnapshotBatch" }
      responses: { "204": { description: Future batch accepted }, "501": { $ref: "#/components/responses/NotImplemented" } }
  /sessions/{sessionId}/screenshots:
    parameters:
      - { $ref: "#/components/parameters/SessionId" }
    get:
      operationId: getScreenshots
      tags: [sessions]
      responses:
        "200":
          description: Future screenshot metadata; not public file URLs
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Screenshot" } }
        "501": { $ref: "#/components/responses/NotImplemented" }
    post:
      operationId: appendScreenshots
      tags: [sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScreenshotBatch" }
      responses: { "204": { description: Future metadata accepted }, "501": { $ref: "#/components/responses/NotImplemented" } }
  /sessions/{sessionId}/integrity-events:
    parameters:
      - { $ref: "#/components/parameters/SessionId" }
    get:
      operationId: getIntegrityEvents
      tags: [sessions]
      responses:
        "200":
          description: Future informational integrity events
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/IntegrityEvent" } }
        "501": { $ref: "#/components/responses/NotImplemented" }
    post:
      operationId: appendIntegrityEvents
      tags: [sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntegrityEventBatch" }
      responses: { "204": { description: Future batch accepted }, "501": { $ref: "#/components/responses/NotImplemented" } }
  /sessions/{sessionId}/submit:
    parameters:
      - { $ref: "#/components/parameters/SessionId" }
    post:
      operationId: submitSession
      tags: [sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionSubmission" }
      responses: { "200": { $ref: "#/components/responses/SessionResult" }, "501": { $ref: "#/components/responses/NotImplemented" } }
  /sessions/{sessionId}/evaluation:
    parameters:
      - { $ref: "#/components/parameters/SessionId" }
    get:
      operationId: getEvaluation
      tags: [evaluations]
      responses: { "200": { $ref: "#/components/responses/EvaluationResult" }, "501": { $ref: "#/components/responses/NotImplemented" } }
    post:
      operationId: recordEvaluation
      tags: [evaluations]
      description: Future internal worker-only endpoint, not candidate or manager supplied scores
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvaluationInput" }
      responses: { "201": { $ref: "#/components/responses/EvaluationResult" }, "501": { $ref: "#/components/responses/NotImplemented" } }
  /sessions/{sessionId}/credential:
    parameters:
      - { $ref: "#/components/parameters/SessionId" }
    get:
      operationId: getCredential
      tags: [credentials]
      responses: { "200": { $ref: "#/components/responses/CredentialResult" }, "501": { $ref: "#/components/responses/NotImplemented" } }
    post:
      operationId: issueCredential
      tags: [credentials]
      description: Future consent-aware server-side signing; no client-supplied token or hash
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialConsent" }
      responses: { "201": { $ref: "#/components/responses/CredentialResult" }, "501": { $ref: "#/components/responses/NotImplemented" } }
  /credentials/verify:
    post:
      operationId: verifyCredential
      tags: [credentials]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialVerificationInput" }
      responses:
        "200":
          description: Future signature and session-hash verification; no candidate PII
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialVerification" }
        "501": { $ref: "#/components/responses/NotImplemented" }
components:
  parameters:
    AuditionId: { name: auditionId, in: path, required: true, schema: { type: string, format: uuid } }
    SessionId: { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    RoomSessionResult:
      description: Server-authoritative session state and clock
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RoomSession" }
    RoomEvidenceResult:
      description: Idempotently stored private evidence
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RoomEvidence" }
    DiagnosticsDisabled:
      description: Invalid test, unavailable audio, or diagnostics disabled outside development
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    NotImplemented:
      description: Current response for every Audition domain endpoint; no side effects
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    AuditionResult:
      description: Future audition definition without invite token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Audition" }
    CandidateResult:
      description: Future candidate
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Candidate" }
    SessionResult:
      description: Future session; server owns timing and state
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Session" }
    EvaluationResult:
      description: Future evaluation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Evaluation" }
    CredentialResult:
      description: Future credential
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Credential" }
  schemas:
    CompanyInput:
      type: object
      required: [company, contact_email, role, job_description]
      properties:
        company: { type: string, minLength: 1, maxLength: 120 }
        contact_email: { type: string, format: email }
        role: { type: string, minLength: 1, maxLength: 160 }
        job_description: { type: string, minLength: 10, maxLength: 8000 }
    CandidateInvitation:
      type: object
      required: [name, email]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email }
    CompanyDraftInput:
      type: object
      properties:
        draft: { $ref: "#/components/schemas/QuestionDraft" }
    DraftQuestion:
      type: object
      required: [requirement, prompt]
      properties:
        requirement: { type: string }
        prompt: { type: string }
        reference_note: { type: [string, "null"] }
    QuestionDraft:
      type: object
      required: [behavioral, technical, starter_code, language]
      properties:
        behavioral: { $ref: "#/components/schemas/DraftQuestion" }
        technical:
          allOf:
            - { $ref: "#/components/schemas/DraftQuestion" }
            - type: object
              required: [follow_up]
              properties:
                follow_up: { type: string }
        starter_code: { type: string }
        language: { type: string, enum: [Python] }
    CompanyWorkspace:
      type: object
      required: [id, company, contact_email, role, job_description, approval_status, draft, snapshot_hash, approved_at, duration_seconds, candidates]
      properties:
        id: { type: string }
        company: { type: string }
        contact_email: { type: string }
        role: { type: string }
        job_description: { type: string }
        approval_status: { type: string, enum: [draft, approved] }
        draft:
          oneOf:
            - { $ref: "#/components/schemas/QuestionDraft" }
            - { type: "null" }
        snapshot_hash: { type: [string, "null"] }
        approved_at: { type: [string, "null"] }
        duration_seconds: { type: integer }
        candidates:
          type: array
          items:
            type: object
            required: [id, name, email, status, score, recommendation, integrity_flags_count, scoring_error, callback_at, invite_path, report_path]
            properties:
              id: { type: string }
              name: { type: string }
              email: { type: string }
              status: { type: string, enum: [Invited, In progress, Scoring, Ready] }
              score: { type: [number, "null"] }
              recommendation: { type: [string, "null"], enum: [Advance, Hold, Not now, null] }
              integrity_flags_count: { type: integer, minimum: 0 }
              scoring_error: { type: [string, "null"] }
              callback_at: { type: [string, "null"] }
              invite_path: { type: string }
              report_path: { type: [string, "null"] }
    HiringReport:
      type: object
      required: [status, error, candidate, company, role, duration_seconds, overall_score, recommendation, reasoning, scores, timeline, vision_error, transcript_missing, final_code, transcript, integrity_flags]
      properties:
        status: { type: string, enum: [pending, scoring, ready, error] }
        error: { type: [string, "null"] }
        candidate: { $ref: "#/components/schemas/Candidate" }
        company: { type: string }
        role: { type: string }
        duration_seconds: { type: integer }
        overall_score: { type: [number, "null"] }
        recommendation: { type: [string, "null"], enum: [Advance, Hold, Not now, null] }
        reasoning: { type: string }
        final_code: { type: string }
        vision_error: { type: [string, "null"] }
        transcript_missing: { type: boolean }
        scores:
          type: array
          items: { $ref: "#/components/schemas/ReviewScore" }
        timeline:
          type: array
          items:
            type: object
            required: [screenshot_id, timestamp_ms, description]
            properties:
              screenshot_id: { type: string }
              timestamp_ms: { type: integer }
              description: { type: string }
        transcript:
          type: array
          items: { $ref: "#/components/schemas/TranscriptEntry" }
        integrity_flags:
          type: array
          items:
            type: object
            required: [id, timestamp_ms, type, details]
            properties:
              id: { type: string }
              timestamp_ms: { type: integer }
              type: { type: string }
              details: { type: object, additionalProperties: true }
    ReviewScore:
      type: object
      required: [requirement, level, rationale, needs_review, quotes]
      properties:
        requirement: { type: string }
        level:
          oneOf:
            - { type: integer, minimum: 1, maximum: 4 }
            - { type: string, enum: [not_covered] }
        rationale: { type: string }
        needs_review: { type: boolean }
        quotes:
          type: array
          items:
            type: object
            required: [source, quote, timestamp_ms, verified]
            properties:
              source: { type: string, enum: [transcript, code] }
              quote: { type: string }
              timestamp_ms: { type: [integer, "null"] }
              verified: { type: boolean }
    CandidateRoom:
      type: object
      required: [audition, candidate, session, editor_content, screenshot_count, last_snapshot_ms]
      properties:
        editor_content: { type: string }
        screenshot_count: { type: integer, minimum: 0 }
        last_snapshot_ms: { type: [integer, "null"], minimum: 0, maximum: 360000 }
        audition:
          allOf:
            - { $ref: "#/components/schemas/Audition" }
            - type: object
              required: [company]
              properties:
                company: { type: string }
        candidate: { $ref: "#/components/schemas/Candidate" }
        session:
          anyOf:
            - { $ref: "#/components/schemas/RoomSession" }
            - { type: "null" }
    RoomSession:
      allOf:
        - { $ref: "#/components/schemas/Session" }
        - type: object
          required: [server_now, conversation_id, transcript_status, transcript_error]
          properties:
            server_now: { type: string, format: date-time }
            conversation_id: { type: [string, "null"] }
            transcript_status: { type: string, enum: [not_started, pending, ready, error] }
            transcript_error: { type: [string, "null"] }
    RoomStartInput:
      type: object
      additionalProperties: false
      required: [screen_surface, candidate_name, candidate_email]
      properties:
        screen_surface: { type: string, enum: [monitor] }
        candidate_name: { type: string, minLength: 1, maxLength: 120 }
        candidate_email: { type: string, format: email, maxLength: 254 }
    RoomVoice:
      type: object
      required: [signed_url, dynamic_variables]
      properties:
        signed_url: { type: string }
        dynamic_variables:
          type: object
          additionalProperties: { type: string }
    ConversationBinding:
      type: object
      additionalProperties: false
      required: [conversation_id]
      properties:
        conversation_id: { type: string, pattern: "^conv_[A-Za-z0-9_-]+$", maxLength: 150 }
        ended: { type: boolean, description: SDK observed conversation end; server can fetch its transcript before the audition deadline }
    RoomSnapshotInput:
      type: object
      additionalProperties: false
      required: [timestamp_ms, content]
      properties:
        timestamp_ms: { type: integer, minimum: 0, maximum: 360000, multipleOf: 10000 }
        content: { type: string, maxLength: 60000 }
    RoomIntegrityInput:
      type: object
      additionalProperties: false
      required: [event_id, timestamp_ms, type]
      properties:
        event_id: { type: string, format: uuid }
        timestamp_ms: { $ref: "#/components/schemas/TimestampMs" }
        type: { type: string, enum: [page_left, window_blur, large_paste, screen_share_stopped] }
        character_count: { type: integer, minimum: 51, maximum: 1000000 }
    RoomCommandInput:
      type: object
      additionalProperties: false
      required: [command_id, kind]
      properties:
        command_id: { type: string, format: uuid }
        kind: { type: string, enum: [initial_context, technical_start, wrap_up, time_check, page_left, screen_share_stopped] }
    RoomCommand:
      type: object
      required: [text, delivery, is_app_message]
      properties:
        text: { type: string }
        delivery: { type: string, enum: [user_message, contextual_update] }
        is_app_message: { type: boolean, enum: [true] }
    RoomEvidence:
      type: object
      required: [saved, timestamp_ms]
      properties:
        saved: { type: boolean }
        timestamp_ms: { $ref: "#/components/schemas/TimestampMs" }
    AdminHealth:
      type: object
      required: [development_only, checks]
      properties:
        development_only: { type: boolean }
        checks: { type: array, items: { $ref: "#/components/schemas/ConnectionCheck" } }
    ConnectionCheck:
      type: object
      required: [id, label, status, message, error, missing_secrets, checked_at, latency_ms]
      properties:
        id: { type: string, enum: [nebius_models, nebius_text, nebius_vision, elevenlabs_tts, elevenlabs_agent] }
        label: { type: string }
        status: { type: string, enum: [ok, error, missing, untested] }
        message: { type: string }
        error: { type: [string, "null"] }
        missing_secrets: { type: array, items: { type: string } }
        checked_at: { type: [string, "null"], format: date-time }
        latency_ms: { type: [integer, "null"], minimum: 0 }
        model_ids: { type: array, items: { type: string } }
        configured_model: { type: string, description: Trimmed non-sensitive model identifier actually sent to Nebius }
        model_env: { type: string, enum: [NEBIUS_TEXT_MODEL, NEBIUS_VISION_MODEL] }
        model_in_catalog: { type: [boolean, "null"], description: Exact case-sensitive catalog membership; null until verified }
        model_catalog_error: { type: string }
        http_status: { type: [integer, "null"], minimum: 100, maximum: 599, description: Upstream provider status, not the diagnostics endpoint status }
        error_response_body: { type: string, description: Full upstream error body with credentials and signed URLs redacted }
        request_endpoint: { type: string }
        request_method: { type: string }
        request_body: { type: string, description: Non-sensitive diagnostic JSON payload; excludes authorization headers }
        completion_details: { $ref: "#/components/schemas/CompletionDiagnostics" }
        output_source: { type: string, enum: [content, reasoning_content], description: Reasoning fallback is permitted only for connection diagnostics }
        thinking_disabled_requested: { type: boolean }
        thinking_parameter_error: { type: string, description: Full redacted provider rejection of the optional thinking parameter }
        output: { type: string }
        image_data_url: { type: string, description: Non-sensitive fixed test image used for the vision request }
        audio_url: { type: string, description: Same-origin temporary audio path; no API key }
        signed_url_available: { type: boolean, description: Signed URL validated server-side; token deliberately not returned to diagnostics browser }
    CompletionDiagnostics:
      type: object
      required: [finish_reason, message, usage]
      properties:
        finish_reason: { type: [string, "null"] }
        message:
          type: object
          required: [content, reasoning_content]
          properties:
            content: { type: [string, "null"] }
            reasoning_content: { type: [string, "null"] }
        usage: { type: [object, "null"], additionalProperties: true }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    ApiError:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
    TimestampMs:
      type: integer
      minimum: 0
      maximum: 360000
      description: Milliseconds elapsed since server_start_time, not an absolute clock time
    QuestionInput:
      type: object
      required: [position, requirement, prompt, phase, time_limit_seconds]
      properties:
        position: { type: integer, minimum: 1 }
        requirement: { type: string, minLength: 1 }
        prompt: { type: string, minLength: 1 }
        phase: { type: string, enum: [Behavioral, Technical] }
        time_limit_seconds: { type: integer, minimum: 1, maximum: 180 }
    FrozenQuestion:
      allOf:
        - { $ref: "#/components/schemas/QuestionInput" }
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    AuditionInput:
      type: object
      additionalProperties: false
      required: [role, job_description, editor_language, frozen_questions]
      properties:
        role: { type: string, minLength: 1 }
        job_description: { type: string, minLength: 1 }
        editor_language: { type: string, minLength: 1 }
        frozen_questions:
          type: array
          minItems: 2
          maxItems: 360
          items: { $ref: "#/components/schemas/QuestionInput" }
          description: Ordered unique positions; each phase sums to 180 seconds; fixed after creation
    Audition:
      type: object
      required: [id, role, job_description, editor_language, duration_seconds, frozen_questions, created_at]
      properties:
        id: { type: string, format: uuid }
        role: { type: string }
        job_description: { type: string }
        editor_language: { type: string }
        duration_seconds: { type: integer, minimum: 60, maximum: 360 }
        frozen_questions: { type: array, items: { $ref: "#/components/schemas/FrozenQuestion" } }
        created_at: { type: string, format: date-time }
    AuditionInvitation:
      type: object
      required: [audition, invite_token]
      properties:
        audition: { $ref: "#/components/schemas/Audition" }
        invite_token: { type: string, minLength: 32, description: Sensitive opaque server-generated invitation secret; never logged }
    CandidateInput:
      type: object
      additionalProperties: false
      required: [name, email]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
    Candidate:
      type: object
      required: [id, audition_id, name, email, status, created_at]
      properties:
        id: { type: string, format: uuid }
        audition_id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        status: { type: string, enum: [Invited, In progress, Submitted, Analyzed] }
        created_at: { type: string, format: date-time }
    InviteInput:
      type: object
      additionalProperties: false
      required: [invite_token]
      properties:
        invite_token: { type: string, minLength: 32 }
    SessionInput:
      type: object
      additionalProperties: false
      required: [candidate_id, invite_token]
      properties:
        candidate_id: { type: string, format: uuid }
        invite_token: { type: string, minLength: 32 }
    Session:
      type: object
      required: [id, candidate_id, server_start_time, deadline_at, status, submitted_at, finish_reason]
      properties:
        id: { type: string, format: uuid }
        candidate_id: { type: string, format: uuid }
        server_start_time: { type: string, format: date-time }
        deadline_at: { type: string, format: date-time, description: Derived as server_start_time plus 360 seconds }
        status: { type: string, enum: [In progress, Submitted] }
        submitted_at: { type: [string, "null"], format: date-time }
        finish_reason: { type: [string, "null"], enum: [time_limit, finished_early, conversation_ended, null] }
    SessionSubmission:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, enum: [time_limit, finished_early, conversation_ended] }
        editor_content: { type: string, maxLength: 60000, description: Final editor state captured at submission, never overwrites a ten-second snapshot }
    TranscriptInput:
      type: object
      required: [sequence, timestamp_ms, speaker, text]
      properties:
        sequence: { type: integer, minimum: 1 }
        timestamp_ms: { $ref: "#/components/schemas/TimestampMs" }
        speaker: { type: string, enum: [candidate, interviewer] }
        text: { type: string }
    TranscriptEntry:
      allOf:
        - { $ref: "#/components/schemas/TranscriptInput" }
        - type: object
          required: [id, session_id, is_app_message, origin]
          properties:
            id: { type: string, format: uuid }
            session_id: { type: string, format: uuid }
            is_app_message: { type: boolean, description: App controls and updates are never candidate scoring evidence }
            origin: { type: string, enum: [app, elevenlabs] }
    TranscriptBatch:
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries: { type: array, minItems: 1, maxItems: 100, items: { $ref: "#/components/schemas/TranscriptInput" } }
    EditorSnapshotInput:
      type: object
      required: [timestamp_ms, content]
      properties:
        timestamp_ms: { type: integer, minimum: 0, maximum: 360000, multipleOf: 10000 }
        content: { type: string, description: Empty source code is allowed; language comes from audition }
    EditorSnapshot:
      allOf:
        - { $ref: "#/components/schemas/EditorSnapshotInput" }
        - type: object
          required: [id, session_id]
          properties:
            id: { type: string, format: uuid }
            session_id: { type: string, format: uuid }
    EditorSnapshotBatch:
      type: object
      additionalProperties: false
      required: [snapshots]
      properties:
        snapshots: { type: array, minItems: 1, maxItems: 37, items: { $ref: "#/components/schemas/EditorSnapshotInput" } }
    ScreenshotInput:
      type: object
      required: [timestamp_ms, file_path, mime_type]
      properties:
        timestamp_ms: { $ref: "#/components/schemas/TimestampMs" }
        file_path: { type: string, minLength: 1, description: Private durable storage reference, not base64 or a public URL }
        mime_type: { type: string, enum: [image/png, image/jpeg, image/webp] }
    Screenshot:
      allOf:
        - { $ref: "#/components/schemas/ScreenshotInput" }
        - type: object
          required: [id, session_id]
          properties:
            id: { type: string, format: uuid }
            session_id: { type: string, format: uuid }
    ScreenshotBatch:
      type: object
      additionalProperties: false
      required: [screenshots]
      properties:
        screenshots: { type: array, minItems: 1, maxItems: 100, items: { $ref: "#/components/schemas/ScreenshotInput" } }
    IntegrityDetails:
      type: object
      additionalProperties: false
      properties:
        duration_ms: { type: integer, minimum: 0, maximum: 360000 }
        character_count: { type: integer, minimum: 0 }
    IntegrityEventInput:
      type: object
      required: [sequence, timestamp_ms, type, details]
      properties:
        sequence: { type: integer, minimum: 1 }
        timestamp_ms: { $ref: "#/components/schemas/TimestampMs" }
        type: { type: string, enum: [page_left, large_paste, screen_share_stopped] }
        details: { $ref: "#/components/schemas/IntegrityDetails" }
    IntegrityEvent:
      allOf:
        - { $ref: "#/components/schemas/IntegrityEventInput" }
        - type: object
          required: [id, session_id]
          properties:
            id: { type: string, format: uuid }
            session_id: { type: string, format: uuid }
    IntegrityEventBatch:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events: { type: array, minItems: 1, maxItems: 100, items: { $ref: "#/components/schemas/IntegrityEventInput" } }
    EvaluationQuote:
      type: object
      additionalProperties: false
      required: [timestamp_ms, quote]
      properties:
        timestamp_ms: { $ref: "#/components/schemas/TimestampMs" }
        quote: { type: string, minLength: 1 }
    RequirementEvaluation:
      type: object
      additionalProperties: false
      required: [requirement, level, rationale, quotes]
      properties:
        requirement: { type: string, minLength: 1 }
        level:
          oneOf:
            - { type: integer, minimum: 1, maximum: 4 }
            - { type: string, enum: [not_covered] }
        rationale: { type: string, minLength: 1 }
        quotes: { type: array, items: { $ref: "#/components/schemas/EvaluationQuote" } }
    EvaluationInput:
      type: object
      required: [requirements, overall_score, spoken_summary_text, spoken_summary_audio_file]
      properties:
        requirements: { type: array, minItems: 1, items: { $ref: "#/components/schemas/RequirementEvaluation" } }
        overall_score: { type: [number, "null"], minimum: 1, maximum: 4, description: Mean of covered requirement levels; null when none covered }
        spoken_summary_text: { type: string, minLength: 1 }
        spoken_summary_audio_file: { type: [string, "null"], minLength: 1, description: Private audio storage reference; null until audio exists }
    Evaluation:
      allOf:
        - { $ref: "#/components/schemas/EvaluationInput" }
        - type: object
          required: [id, session_id, created_at]
          properties:
            id: { type: string, format: uuid }
            session_id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
    CredentialConsent:
      type: object
      additionalProperties: false
      required: [consent]
      properties:
        consent: { type: boolean, enum: [true] }
    Credential:
      type: object
      required: [id, session_id, evaluation_id, signed_token, session_data_hash, issued_at]
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        evaluation_id: { type: string, format: uuid }
        signed_token: { type: string, minLength: 1 }
        session_data_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        issued_at: { type: string, format: date-time }
    CredentialVerificationInput:
      type: object
      additionalProperties: false
      required: [signed_token]
      properties:
        signed_token: { type: string, minLength: 1 }
    CredentialVerification:
      type: object
      required: [valid]
      properties:
        valid: { type: boolean }
        credential_id: { type: string, format: uuid }
        session_data_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        issued_at: { type: string, format: date-time }
